schema-version: 1

database:
  # 建议使用 jdbc:mysql://HOST:3306/tianjitown?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
  jdbc-url: '${TIANJITOWN_DB_URL}'
  username: '${TIANJITOWN_DB_USER}'
  password: '${TIANJITOWN_DB_PASSWORD}'
  pool:
    maximum-size: 6
    minimum-idle: 1
    connection-timeout-ms: 5000

version-lock:
  minecraft: '26.2'
  java-feature: 25
  plugins:
    Residence: '6.0.2.4'
    Vault: '1.7.3-b131'
    XConomy: '2.26.3'
    QuickShop-Hikari: '6.2.0.10'

phase0:
  # 必须只在预发服临时开启。生产服保持 false。
  allow-residence-smoke: false
  residence-smoke-world: '__SET_PREPRODUCTION_WORLD__'

phase1:
  # 可通过 /townadmin maintenance on|off 即时切换；开启时玩家 UI 和表单全部暂停。
  maintenance-mode: false
  application:
    # 撤回或被拒绝后的再次申请冷却。
    cooldown-hours: 24
    # 选址提交后的临时保留时间。
    reservation-minutes: 60
  site:
    # 配置了服务区的世界会限制在服务区内；未配置服务区的已加载世界不受此项限制。
    require-service-area: true
    minimum-buffer-chunks: 1
    # 三维领地预览会重复刷新，使边界在水平面和 Y 轴方向上持续可见。
    preview-duration-seconds: 15
    preview-interval-ticks: 20
    preview-vertical-range-blocks: 24
    # 坐标均为区块坐标；3×3 初始领地必须完整位于矩形内。
    service-areas:
      - world: world
        min-chunk-x: -1000
        max-chunk-x: 1000
        min-chunk-z: -1000
        max-chunk-z: 1000
    # 出生点、活动区和管理区应在此配置；以下示例保护出生区。
    blacklist:
      - world: world
        min-chunk-x: -8
        max-chunk-x: 8
        min-chunk-z: -8
        max-chunk-z: 8

