database:
  # 相对路径以 plugins/TianjiTown 为基准，也可填写绝对路径。
  file: 'tianjitown.db'
  connection-timeout-ms: 5000
  busy-timeout-ms: 5000

town:
  # 可通过 /tianjitown maintenance on|off 即时切换；开启时玩家 UI 和表单全部暂停。
  maintenance-mode: false
  # 玩家自行领取手册的冷却；管理员发放跳过冷却，也不更新自行领取的冷却时间。
  handbook-cooldown-minutes: 60
  application:
    # 审批通过时扣取，并转入小镇初始公共资金；必须大于 0，且符合货币精度。
    fee: '5000.00'
    # 撤回或被拒绝后的再次申请冷却。
    cooldown-hours: 24
    # 选址提交后的临时保留时间。
    reservation-minutes: 60
  membership:
    # 玩家同时最多拥有的待处理入镇申请数。
    maximum-pending-applications: 3
    # 入镇申请有效期，以及被拒绝和主动退出后的申请冷却。
    application-lifetime-hours: 48
    rejection-cooldown-hours: 24
    leave-cooldown-hours: 24
  site:
    minimum-buffer-chunks: 1
    # 三维领地预览会重复刷新火焰粒子，使边界在水平面和 Y 轴方向上持续可见。
    preview-duration-seconds: 15
    preview-interval-ticks: 20
    preview-vertical-range-blocks: 24

economy:
  # 专用 Vault 托管账户；自动排除 XConomy/CMI 排行与对应统计。
  # 已有配置为 tax 时启动自动改名并保留原 UUID/余额；迁移记录必须随插件数据一起备份。
  settlement-account: 'tianjitown-tax'
  # Economy provider 未声明 fractionalDigits 时使用此精度。
  money-scale: 2
  # 可立即停止新税收；已存在账本查询和清算对账仍保持可用。
  tax:
    enabled: true
    subsidy:
      # QuickShop、Jobs 和 GlobalMarketPlus 共用补贴额度，按小镇分别计数；上海时间每周一 04:00 与每天 04:00/16:00 刷新。
      weekly-limit: '10000.00'
      twelve-hour-limit: '2000.00'
  # 可立即停止捐款、激活等新资金写入，不影响税款入账、退款和查询。
  consumption:
    enabled: true
  reconciliation-interval-minutes: 5
  expansion:
    # 首次激活价格；第 n 次收费 = 基础价 × 1.05^(n-1)，批量选择逐块累计。
    base-cost: '5000.00'

buffs:
  # 关闭商店只会阻止新购买；已购买 Buff 仍持续到期并正常清理。
  shop-enabled: true
  catalog:
    speed:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:movement_speed'
      operation: ADD_SCALAR
      base-price: '6000.00'
      maximum-level: 5
      amount-per-level: 0.2
    health:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:max_health'
      operation: ADD_NUMBER
      base-price: '10080.00'
      maximum-level: 5
      amount-per-level: 4.0
    diving:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:oxygen_bonus'
      operation: ADD_NUMBER
      base-price: '3000.00'
      maximum-level: 1
      amount-per-level: 19
    safe_fall:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:safe_fall_distance'
      operation: ADD_NUMBER
      base-price: '4000.00'
      maximum-level: 3
      amount-per-level: 2
    mining:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:block_break_speed'
      operation: ADD_SCALAR
      base-price: '6000.00'
      maximum-level: 3
      amount-per-level: 0.1

territory:
  building-refund:
    # 只处理玩家在自己小镇有效 Residence 内的安全单方块放置；每周一零点重新计数。
    enabled: true
    chance: 0.25
    weekly-limit: 3000
    counter-retention-weeks: 12
    reset-zone: Asia/Shanghai
    # REDSTONE_CATEGORY 会展开为全部红石类方块；其余是默认难以获取方块。
    blacklist:
      - REDSTONE_CATEGORY
      - ANCIENT_DEBRIS
      - NETHERITE_BLOCK
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - DIAMOND_BLOCK
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - EMERALD_BLOCK
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - NETHER_GOLD_ORE
      - GOLD_BLOCK
      - RAW_GOLD_BLOCK
      - BEACON
      - DRAGON_EGG
      - SPAWNER
      - TRIAL_SPAWNER
      - VAULT
      - BUDDING_AMETHYST
      - REINFORCED_DEEPSLATE
      - END_PORTAL_FRAME
      - CRYING_OBSIDIAN
      - ENCHANTING_TABLE
  beacon:
    # 当前有效且区块正在运行的信标覆盖本镇有效领地；失效后停止续期，沿用原版残留时间。
    enabled: true
    # 20~200 tick，必须短于一级信标的原版持续时间（220 tick）。
    refresh-interval-ticks: 100

operations:
  # 插件初始化阶段执行一次统一诊断；校验失败时保持 LOCKED，不注册业务运行时。
  # 运行期间可使用 /tianjitown diagnose 手动执行。
  quickshop-diagnostic-days: 7
