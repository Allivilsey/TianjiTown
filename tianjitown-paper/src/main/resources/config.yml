database:
  # 相对路径以 plugins/TianjiTown 为基准，也可填写绝对路径。
  file: 'tianjitown.db'
  connection-timeout-ms: 5000
  busy-timeout-ms: 5000

town:
  # 可通过 /tianjitown maintenance on|off 即时切换；开启时玩家 UI 和表单全部暂停。
  maintenance-mode: false
  # 由服务台管理命令维护；列表同时保留方块 PDC 中的服务台 ID 和当前位置。
  service-stations: []
  # 玩家每次领取手册后需要等待的时间，管理员发放同样遵守该冷却。
  handbook-cooldown-minutes: 60
  application:
    # 撤回或被拒绝后的再次申请冷却。
    cooldown-hours: 24
    # 选址提交后的临时保留时间。
    reservation-minutes: 60
  membership:
    # 玩家同时最多拥有的待处理入镇申请数。
    maximum-pending-applications: 3
    # 入镇申请有效期，以及被拒绝和主动退出后的申请冷却。
    application-lifetime-hours: 48
    rejection-cooldown-hours: 24
    leave-cooldown-hours: 24
  site:
    minimum-buffer-chunks: 1
    # 三维领地预览会重复刷新火焰粒子，使边界在水平面和 Y 轴方向上持续可见。
    preview-duration-seconds: 15
    preview-interval-ticks: 20
    preview-vertical-range-blocks: 24

economy:
  # 按 Paper 离线玩家身份（UUID 和实际名称大小写）访问的 Vault 清算账户；需与 QuickShop 原 tax 账户切换方案一致。
  settlement-account: 'tax'
  # Economy provider 未声明 fractionalDigits 时使用此精度。
  money-scale: 2
  # 可立即停止新税收；已存在账本查询和清算对账仍保持可用。
  tax:
    enabled: true
    subsidy:
      # QuickShop 等额补贴按小镇分别计数；上海时间每周一 04:00 与每天 04:00/16:00 刷新。
      weekly-limit: '50000.00'
      twelve-hour-limit: '10000.00'
  # 可立即停止捐款、扩张等新资金写入，不影响税款入账、退款和查询。
  consumption:
    enabled: true
  reconciliation-interval-minutes: 5
  expansion:
    # 首次扩张价格；第 n 次收费 = 基础价 × 1.05^(n-1)，批量选择逐块累计。
    base-cost: '5000.00'

buffs:
  # 关闭商店只会阻止新购买；已购买 Buff 仍持续到期并正常清理。
  shop-enabled: true
  catalog:
    speed:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:movement_speed'
      operation: ADD_SCALAR
      # I 级每周基础价；1~4 周分别无折扣、九五折、9折、八五折（每多一周优惠5个百分点）。
      base-price: '6720.00'
      maximum-level: 5
      stacking: LEVEL_UP
      amount-per-level: 0.2
    health:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:max_health'
      operation: ADD_NUMBER
      base-price: '10080.00'
      maximum-level: 5
      stacking: LEVEL_UP
      amount-per-level: 4.0

    night_vision:
      effect-kind: POTION
      effect-key: 'minecraft:night_vision'
      operation: AMPLIFIER
      base-price: '2688.00'
      maximum-level: 1
      stacking: REFRESH
      amount-per-level: 1
    water_breathing:
      effect-kind: POTION
      effect-key: 'minecraft:water_breathing'
      operation: AMPLIFIER
      base-price: '4032.00'
      maximum-level: 1
      stacking: REFRESH
      amount-per-level: 1
    safe_fall:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:safe_fall_distance'
      operation: ADD_NUMBER
      base-price: '4032.00'
      maximum-level: 3
      stacking: REFRESH
      amount-per-level: 2
    mining:
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:block_break_speed'
      operation: ADD_SCALAR
      base-price: '6720.00'
      maximum-level: 3
      stacking: REFRESH
      amount-per-level: 0.1
    fire_resistance:
      effect-kind: POTION
      effect-key: 'minecraft:fire_resistance'
      operation: AMPLIFIER
      base-price: '8064.00'
      maximum-level: 1
      stacking: REFRESH
      amount-per-level: 1

territory:
  building-refund:
    # 只处理玩家在自己小镇有效 Residence 内的安全单方块放置；每周一零点重新计数。
    enabled: true
    chance: 0.25
    weekly-limit: 3000
    counter-retention-weeks: 12
    reset-zone: Asia/Shanghai
    # REDSTONE_CATEGORY 会展开为全部红石类方块；其余是默认难以获取方块。
    blacklist:
      - REDSTONE_CATEGORY
      - ANCIENT_DEBRIS
      - NETHERITE_BLOCK
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - DIAMOND_BLOCK
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - EMERALD_BLOCK
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - NETHER_GOLD_ORE
      - GOLD_BLOCK
      - RAW_GOLD_BLOCK
      - BEACON
      - DRAGON_EGG
      - SPAWNER
      - TRIAL_SPAWNER
      - VAULT
      - BUDDING_AMETHYST
      - REINFORCED_DEEPSLATE
      - END_PORTAL_FRAME
      - CRYING_OBSIDIAN
      - ENCHANTING_TABLE
  beacon:
    # 镇长或副镇长切换信标效果时记录更高等级；数据库内效果覆盖所有小镇领地。
    enabled: true
    refresh-interval-ticks: 100

operations:
  # 插件初始化阶段执行一次统一诊断；校验失败时保持 LOCKED，不注册业务运行时。
  # 运行期间可使用 /tianjitown diagnose 手动执行。
  quickshop-diagnostic-days: 7
