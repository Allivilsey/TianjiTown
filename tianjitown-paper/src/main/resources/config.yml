schema-version: 10

database:
  # 相对路径以 plugins/TianjiTown 为基准，也可填写绝对路径。
  file: 'tianjitown.db'
  connection-timeout-ms: 5000
  busy-timeout-ms: 5000

town:
  # 可通过 /townadmin maintenance on|off 即时切换；开启时玩家 UI 和表单全部暂停。
  maintenance-mode: false
  # 由服务台管理命令维护；列表同时保留方块 PDC 中的服务台 ID 和当前位置。
  service-stations: []
  # 玩家每次领取手册后需要等待的时间，管理员发放同样遵守该冷却。
  handbook-cooldown-minutes: 60
  application:
    # 撤回或被拒绝后的再次申请冷却。
    cooldown-hours: 24
    # 选址提交后的临时保留时间。
    reservation-minutes: 60
  membership:
    # 玩家同时最多拥有的待处理入镇申请数。
    maximum-pending-applications: 3
    # 入镇申请有效期，以及被拒绝和主动退出后的申请冷却。
    application-lifetime-hours: 48
    rejection-cooldown-hours: 24
    leave-cooldown-hours: 24
  site:
    minimum-buffer-chunks: 1
    # 三维领地预览会重复刷新火焰粒子，使边界在水平面和 Y 轴方向上持续可见。
    preview-duration-seconds: 15
    preview-interval-ticks: 20
    preview-vertical-range-blocks: 24
    # 出生点、活动区和管理区应在此配置；以下示例保护出生区。
    blacklist:
      - world: world
        min-chunk-x: -8
        max-chunk-x: 8
        min-chunk-z: -8
        max-chunk-z: 8

governance:
  # 镇长发起转让后，候选成员必须在有效期内明确接受。
  transfer-confirmation-hours: 24
  voting:
    # 最近这些天内登录过的成员属于活跃成员候选。
    active-member-days: 30
    # 入镇达到此天数后才可进入新投票的冻结选民快照；0 表示不额外限制。
    minimum-membership-days: 0
    # 投票到期后由每分钟执行一次的幂等任务结算。
    duration-hours: 72

economy:
  # 按 Paper 离线玩家身份（UUID 和实际名称大小写）访问的 Vault 清算账户；需与 QuickShop 原 tax 账户切换方案一致。
  settlement-account: 'tax'
  # Economy provider 未声明 fractionalDigits 时使用此精度。
  money-scale: 2
  # 可立即停止新税收；已存在账本查询和清算对账仍保持可用。
  tax:
    enabled: true
    subsidy:
      # QuickShop 等额补贴按小镇分别计数；每周一 00:00 与每天 00:00/12:00 刷新。
      weekly-limit: '50000.00'
      twelve-hour-limit: '5000.00'
  # 可立即停止捐款、扩张等新资金写入，不影响税款入账、退款和查询。
  consumption:
    enabled: true
  reconciliation-interval-minutes: 5
  expansion:
    # 每次扩张均使用同一价格，不随现有领地单元数增长。
    fixed-cost: '3000.00'

buffs:
  # 关闭商店只会阻止新购买；已购买 Buff 仍持续到期并正常清理。
  shop-enabled: true
  catalog:
    speed:
      display-name: '速度'
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:movement_speed'
      operation: ADD_SCALAR
      # 每小时基础价；玩家选择 1~4 周和 I~V 强度后按周折扣计价。
      base-price: '500.00'
      maximum-level: 5
      stacking: LEVEL_UP
      amount-per-level: 0.2
      purchasing-roles: [MAYOR, DEPUTY_MAYOR]
    health:
      display-name: '生命'
      effect-kind: ATTRIBUTE
      effect-key: 'minecraft:max_health'
      operation: ADD_NUMBER
      base-price: '1000.00'
      maximum-level: 5
      stacking: LEVEL_UP
      amount-per-level: 4.0
      purchasing-roles: [MAYOR, DEPUTY_MAYOR]

territory:
  building-refund:
    # 只处理玩家在自己小镇有效 Residence 内的安全单方块放置；每周一零点重新计数。
    enabled: true
    chance: 0.25
    weekly-limit: 3000
    counter-retention-weeks: 12
    reset-zone: Asia/Shanghai
    # REDSTONE_CATEGORY 会展开为全部红石类方块；其余是默认难以获取方块。
    blacklist:
      - REDSTONE_CATEGORY
      - ANCIENT_DEBRIS
      - NETHERITE_BLOCK
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - DIAMOND_BLOCK
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - EMERALD_BLOCK
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - NETHER_GOLD_ORE
      - GOLD_BLOCK
      - RAW_GOLD_BLOCK
      - BEACON
      - DRAGON_EGG
      - SPAWNER
      - TRIAL_SPAWNER
      - VAULT
      - BUDDING_AMETHYST
      - REINFORCED_DEEPSLATE
      - END_PORTAL_FRAME
      - CRYING_OBSIDIAN
      - ENCHANTING_TABLE
  beacon:
    # 镇长或副镇长切换信标效果时记录更高等级；数据库内效果覆盖小镇领地。
    enabled: true
    refresh-interval-ticks: 100
    allowed-worlds: [world]

operations:
  # 插件每次成功启动后自动执行一次统一诊断；运行期间可使用 /townadmin diagnose 手动执行。
  quickshop-diagnostic-days: 7
  backup:
    # 在线备份只覆盖 TianjiTown SQLite 与 config.yml；依赖插件需按运维手册统一备份。
    # 目录必须是 plugins/TianjiTown 下的相对路径，禁止绝对路径或 ../ 逃逸。
    enabled: true
    interval-hours: 6
    retention-count: 14
    directory: backups

