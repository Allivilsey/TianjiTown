    review-application: '&b[打开审核界面]'
    edit-application: '&b[修改申请]'
    open-system: '&b[打开小镇系统]'
    handle: '&b[处理]'
    view-tax: '&b[查看税率]'
    review-join: '&b[立即审核]'
    confirm: '&c[确认执行]'
