# TianjiTown 玩家消息和 Dialog 文本。
# 所有文本均支持 & 颜色码；{name} 形式的内容是运行时占位符。
system:
  # 玩家入口处于维护状态时显示。
  maintenance: '&c小镇系统正在维护，请稍后再试。'
  # 玩家点击已经失效的 Dialog 操作时显示。
  menu-expired: '&c这个界面已经失效，请重新打开小镇服务。'
  invalid-menu-data: '&c界面数据已过期，请重新打开后再试。'
  # {detail} 为具体失败原因。
  operation-failed: '&c这项操作错误：{detail}'
  # {key} 为未找到配置值的消息键；这是消息文件可用时的运行期回退。
  missing-message: '&c缺少消息配置: {key}'

# 建镇申请资料校验消息；{minimum}/{maximum} 为边界，{index} 为规则序号。
validation:
  common:
    value-required: '&c{path} 不能为空'
    range: '&c{path} 必须在 {minimum}~{maximum} 范围内'
    integer-type: '&c{path} 必须为整数'
    non-negative: '&c{path} 不能小于 0'
  application:
    name-length: '&c名称长度必须为 {minimum}~{maximum}'
    name-characters: '&c名称只能包含文字、数字、空格、下划线、连字符和间隔点'
    name-format: '&c名称含有不允许的格式或控制字符'
    residence-name-length: '&c小镇代码长度必须为 {minimum}~{maximum}'
    residence-name-characters: '&c小镇代码只能包含英文字母，不允许空格、数字或特殊符号'
    description-length: '&c简介不能超过 {maximum} 字符'
    description-format: '&c简介含有不允许的格式或字符'
    rule-count: '&c规则数量必须为 {minimum}~{maximum}'
    rule-length: '&c规则 {index} 不能超过 {maximum} 字符'
    rule-format: '&c规则 {index} 含有不允许的格式或字符'
  # Vault 清算服务的输入校验；金额均为最小货币单位，精度范围为 0~8。
  vault:
    account-name-required: '清算账户名不能为空'
    scale-range: 'Vault 金额精度必须在 0~8 之间'
    donation-amount-positive: '捐款金额必须大于 0'
    refund-amount-positive: '退款金额必须大于 0'
    return-amount-positive: '返还金额必须大于 0'
    adjustment-non-zero: '调整金额不能为 0'
  # 捐款自动退款输入校验。
  donation:
    refund-operation: '玩家信息错误，请联系管理员'
  # Buff 配置校验；{key}=Buff key，{path}=配置路径，{value}=非法值。
  buff:
    unknown: '&c未知 Buff: {key}'
    label-required: '&cBuff {key} 缺少显示标签，请在 messages.yml 添加 dialog.buff.labels.{key}'
    duplicate-key: '&c重复 Buff key: {key}'
    section-required: '&c{path} 必须为配置节'
    enum-unsupported: '&c{path} 的值不受支持: {value}'
  # 通用配置值校验；{path}=配置路径。
  configuration:
    boolean-type: '&c{path} 必须为布尔值'
    int-range: '&c{path} 超出 int 范围'
    number-type: '&c{path} 必须为数字'
    finite-number: '&c{path} 必须为有限数'
    text-type: '&c{path} 必须为文本'
    decimal-text: '&c{path} 必须为十进制文本'
    string-list-type: '&c{path} 必须为文本列表'
    list-type: '&c{path} 必须为列表'
    long-range: '&c{path} 必须为 long 范围内的整数'
  # 运行时配置和数据库校验；{path}=配置路径，{minimum}/{maximum}=允许范围。
  runtime-configuration:
    database-file-required: '&cdatabase.file 不能为空'
    database-file-path-invalid: '&cdatabase.file 必须指向数据库文件'
    database-directory-create-failure: '&c无法创建 SQLite 目录: {path}'
  # 经济设置校验消息；{path}=配置路径，{minimum}/{maximum}=允许的金额精度边界。
  economy:
    money-scale-range: '&c{path} 必须在 {minimum}~{maximum} 之间'
    expansion-cost-positive: '&c{path} 必须大于 0'
    twelve-hour-limit-exceeds-weekly: '&c{path} 不能大于每周限额'
    expansion-cost-overflow: '&c金额超过上限'
    expansion-cost-range: '&c{path} 价格超出次级货币单位范围'
  # 建筑返还、信标增强和统一诊断校验消息；{path}=配置路径，{value}=非法材料值，
  # {minimum}/{maximum}=允许范围；refresh-interval-ticks 的范围单位为 tick，diagnostic-days 为天。
  bonus:
    building-refund-chance-range: '&c{path} 必须在 (0, 1] 范围内'
    integer-range: '&c{path} 超出整数范围'
    building-refund-reset-zone-invalid: '&c{path} 不是有效时区'
    building-refund-blacklist-required: '&c{path} 至少需要一个方块或分组'
    building-refund-blacklist-material-invalid: '&c建筑返还黑名单材料无效: {value}'
    diagnostic-days-range: '&c{path} 必须在 {minimum}~{maximum} 天之间'
  # SitePolicy 预览参数校验。
  site:
    areas-required: '领地预览至少需要一个区域'
    world-mismatch: '领地预览区域必须位于同一世界'
    focus-missing: '领地中心不在预览区域中'
  # TerritoryService 扩张校验消息；批量选择失败、身份校验和批量请求状态不含动态占位符。
  territory:
    batch-selection-required: '请至少选择一个领地单元'
    batch-capacity-exceeded: '批量扩张后超过领地单元上限'
    batch-grid-out-of-bounds: '选中的领地单元超出 5×5 扩张网格'
    batch-duplicate-selection: '批量扩张包含重复领地单元'
    batch-occupied-selection: '选中的领地单元已经被占领'
    batch-not-connected: '批量选区必须与现有领地四方向连通'
    batch-request-id-required: '批量扩张幂等键不能为空'
    batch-already-refunded: '该批量扩张操作已经退款，请重新选择区域'
    town-required: '你不属于任何小镇'
    mayor-required: '只有镇长可以使用公共资金扩张'
    origin-missing: '初始领地单元缺失'
    capacity-reached: '领地单元已达到配置上限'

handbook:
  # 通过小镇手册打开玩家入口后的领取结果。
  received: '&a小镇手册已放入你的背包。'
  # {minutes} 为剩余冷却时间（分钟）。
  cooldown: '&e每小时可以领取一次小镇手册，请在 {minutes} 分钟后再试。'
  # 发放手册物品的书名、显示名和页面内容；页面中的换行由 YAML 双引号保留。
  item-title: '小镇手册'
  item-display-name: '&6小镇手册'
  item-pages: "&6小镇服务\n\n&0右键本手册可打开小镇菜单。\n\n&8本物品通过内部标识识别，改名不会复制其功能。"

station:
  # 管理员设置、移除公共服务台或专属服务台时的结果。
  created-public: '&a已设置公共小镇服务台。'
  created-town: '&a已为“{town}”设置专属小镇服务台。'
  already-exists: '&e这个讲台已经是小镇服务台。'
  town-limit: '&e“{town}”已经拥有一个专属小镇服务台，请先移除旧服务台。'
  removed: '&a小镇服务台已移除。'
  mayor-only: '&c只有小镇镇长或管理员可以放置手册来设置服务台。'

application:
  # 建镇申请草稿与初始成员提醒的结果。
  draft-saved: '&a申请草稿已保存。接下来请选择小镇领地并等待两名初始成员确认。'
  reminder-sent: '&a已重新提醒尚未确认的初始成员。'
  # {seconds} 为剩余提醒冷却时间（秒）。
  reminder-cooldown: '&e五分钟内只能提醒一次，请在 {seconds} 秒后再试。'

# 通过聊天栏、ActionBar 和管理员命令发送的消息。
# 本分组中的消息支持 & 颜色码；花括号占位符会由程序替换为实际值。
chat:
  # 聊天栏中的可点击按钮文本；按钮的具体行为由程序决定。
  buttons:
    teleport: '&b[传送]'
    view-rules: '&b[查看新规则]'
    handle-transfer: '&b[处理转让]'
    view-votes: '&b[前往投票]'
    view-finance: '&b[查看公共资金]'
    review-application: '&b[打开审核界面]'
    edit-application: '&b[修改申请]'
    open-system: '&b[打开小镇系统]'
    handle: '&b[处理]'
    view-tax: '&b[查看税率]'
    review-join: '&b[立即审核]'
    confirm: '&c[确认执行]'
    cancel: '&a[取消]'
    open-tooltip: '&7点击打开'
    confirm-tooltip: '&c60 秒内点击确认'
    cancel-tooltip: '&a取消本次操作'

  # 小镇服务台的设置、查询、列表和传送结果。
  # 占位符：{id}=服务台 ID，{location}=坐标，{owner}=归属小镇，{status}=状态，{count}=数量。
  station:
    target-lectern: '&c请看向 6 格内的讲台后重试。'
    target-station: '&c请看向 6 格内的小镇服务台后重试。'
    already-exists: '&e该讲台已经是小镇服务台。'
    invalid-data: '&c该讲台数据异常。'
    restored: '&a已恢复该小镇服务台标记，ID: {id}'
    created: '&a已创建小镇服务台，ID: {id}'
    unregistered: '&c当前讲台未注册为小镇服务台。'
    unregistered-location: '&e当前讲台未注册为小镇服务台。位置: {location}'
    invalid-marker: '&c当前讲台携带无效的服务台标记：ID 与登记坐标不一致。'
    info-title: '&6小镇服务台详情'
    info-id: '&7ID: &f{id}'
    info-location: '&7位置: &f{location}'
    info-status: '&7状态: &a有效'
    list-title: '&6小镇服务台列表（{count}）'
    list-empty: '&7当前没有已登记的服务台。'
    public-owner: '公共'
    list-entry: '&e{id} &7{location} · {owner} &8[{status}&8]'
    world-unloaded: '&c服务台所在世界当前未加载。'
    block-changed: '&c服务台方块已变化或登记不一致，无法传送。'
    teleported: '&a已传送至小镇服务台。'
    teleport-failed: '&c无法传送至小镇服务台。'
    status-world-unloaded: '&c世界未加载'
    status-chunk-unloaded: '&7区块未加载'
    status-block-changed: '&c方块已变化'
    status-valid: '&a有效'
    status-mismatch: '&c登记不一致'

  # 玩家传送到小镇领地或预览领地边界时的提示。
  # 占位符：{scope}=预览范围标签，{count}=领地单元数量，{duration}=粒子显示时长（秒）。
  site:
    world-unloaded: '&c领地所在世界当前未加载。'
    teleport-failed: '&c无法传送到领地传送点。'
    teleported: '&a已传送至领地传送点。'
    wrong-world: '&c预览领地不在当前世界。'
    preview-scope-single: '5×5 区块'
    preview-scope-multiple: '{count} 个领地单元'
    preview-started: '&e已显示 {scope} 的完整三维边界，粒子将持续约 {duration} 秒。'
    # 领地预览、传送点设置和 Residence 传送流程的运行时详情。
    no-active-territory: '小镇没有已生效的领地单元'
    teleport-point-mayor-required: '只有镇长可以设置领地传送点'
    invalid-grid-target: '领地网格坐标无效'

  # 玩家申请操作的资源状态详情。
  application:
    not-found: '申请不存在'
    invalid-form-step: '未知申请表单步骤'

  # 登录、申请、投票、税率和成员关系变化产生的主动通知。
  # 占位符：{town}=小镇名，{count}=数量，{rate}=税率，{reason}=原因，{applicant}=申请人，{member}=成员名。
  notification:
    rules-updated: '&e小镇规则已有更新，请阅读并重新确认后继续使用小镇菜单。 '
    mayor-transfer: '&6镇长邀请你接任“{town}”。 '
    pending-votes: '&b你有 {count} 个小镇治理投票待处理。 '
    vote-created: "&b{creator} 发起了“{type}”投票，目标：{target}；截止 {ends}，需要 {required} 票通过。 "
    tax-updated: '&e小镇税率已更新为 {rate}。 '
    application-approved: '&a你的小镇“{town}”已获批准并创建完成。'
    application-needs-changes: '&e你的小镇申请需要补充资料：{reason} '
    application-rejected: '&c你的小镇申请已被拒绝：{reason} '
    # 申请没有审核原因时使用的默认原因。
    application-needs-changes-default-reason: '请查看申请详情'
    application-rejected-default-reason: '未提供原因'
    application-provision-failed: '&c你的小镇已通过审核，但自动创建暂时失败；管理员会处理。 '
    member-removed: '&c你已被移出当前小镇。'
    visitor-added: '&a你已被加入一个小镇的访客名单，并获得该镇领地权限。'
    visitor-removed: '&e你已被移出一个小镇的访客名单，并失去该镇领地权限。'
    transfer-request: '&6你收到了一项镇长转让请求。 '
    transfer-accepted: '&e镇长转让已被接受。'
    transfer-rejected: '&e候选成员拒绝了镇长转让。'
    join-request: '&6{applicant} 申请加入“{town}” '
    join-approved: '&a你加入“{town}”的申请已获批准 '
    join-rejected: '&e你加入“{town}”的申请已被拒绝，24 小时后可再次申请 '
    new-application: '&6收到新的小镇申请：“{town}” '
    initial-member-response-confirmed: '&a{member} 已确认成为建镇初始成员。'
    initial-member-response-rejected: '&e{member} 已拒绝成为建镇初始成员。'

  # /townadmin 命令直接返回的消息。
  # 除特别说明外，{detail} 表示后端操作返回的详细结果；{report}/{file}=文件路径。
  admin:
    no-permission: '&c没有权限。'
    reload: '&a配置与 messages.yml 已重新读取；税收/消费、Buff 商店和领地加成开关立即生效。SQLite、清算账户、金额精度和商品定义需重启后生效。'
    unknown-command: '&c未知子命令：{command}。使用 /townadmin help 查看帮助。'
    argument-error: '&c参数错误: {detail}'
    status-header: '&6TianjiTown {version}: &f{state}'
    status-detail: '&7- {detail}'
    status-sqlite: '&7- SQLite 运行状态: {state}'
    status-buffs: '&7- Buff 商店: {state}，配置商品={count}'
    status-refund: '&7- 建筑返还: {state}，黑名单={blacklist}，周上限={limit}'
    status-beacon: '&7- 信标增强: {state}'
    status-diagnostic: '&7- 最近统一诊断: {detail}，报告={report}'
    status-diagnostic-no-report: '&7- 最近统一诊断: {detail}'
    status-player-entry: '&7- 玩家入口: {state}'

    # 维护模式和启动确认按钮相关消息。
    maintenance-status: '&6维护模式: &f{state}'
    maintenance-status-enabled: '&6维护模式: &f已开启'
    maintenance-status-disabled: '&6维护模式: &f已关闭'
    maintenance-enabled: '&e维护模式已开启；服务台、手册、玩家界面和表单提交现已暂停。'
    maintenance-disabled: '&a维护模式已关闭；玩家入口已恢复。'
    confirm-invalid: '&c确认链接无效，请重新发出危险操作命令。'
    confirm-success: '&e已确认：{description}'
    confirm-start-failed: '&c确认后的操作启动失败: {detail}'
    confirm-expired: '&c确认已过期，请重新发出危险操作命令。'
    confirm-not-owner: '&c该确认不属于你，未执行任何操作。'
    confirm-unavailable: '&c确认不存在或已经使用。'
    cancel-invalid: '&c取消链接无效。'
    cancel-success: '&a已取消：{description}'
    cancel-expired: '&c确认已过期，无需取消。'
    cancel-not-owner: '&c该确认不属于你。'

    # /townadmin Tab 补全中的参数位置提示；仅用于显示，不是可提交的命令参数。
    completion:
      reason-hint: '<原因>'
      player-hint: '<玩家>'
      amount-hint: '<金额>'

    # 系统操作参数；这些消息会作为参数错误详情嵌入 argument-error。
    usage-diagnose: '用法: /townadmin diagnose [1~180天]'
    usage-maintenance: '用法: /townadmin maintenance <on|off|status>'
    usage-audit: '用法: /townadmin audit [1~200]'
    audit-limit-integer: 'audit 数量必须是 1~200 的整数'
    audit-limit-range: 'audit 数量必须在 1~200'

    # 审计、服务台管理和申请审核列表消息；{action}=申请审核动作，{town}=小镇名。
    audit-title: '&6最近审计记录:'
    audit-record: '&7#{id} {created} {actor} {action} {target-type}/{target-id} 原因={reason}'
    station-player-only: '&c该服务台操作需要游戏内管理员看向讲台执行。'
    station-help-create: '&e/townadmin station create|remove|info（玩家看向讲台）'
    station-help-list: '&e/townadmin station list'
    usage-application-review: '用法: /townadmin application {action} <小镇全名> <原因>'
    application-not-found: '找不到待处理申请 “{town}”'
    pending-applications: '&6待处理申请: {count}'
    application-entry: '&e{town} &7申请人={applicant}'
    handbook-target: '&c目标玩家必须在线。用法: /townadmin handbook <player>'
    handbook-delivered: '&a已向 {player} 发放小镇手册。'
    handbook-cooldown: '&e未向 {player} 发放手册：该玩家仍在领取冷却中。'
    application-rejected: '&a申请已拒绝，选址预留已释放。'
    application-change-sent: '&a已要求申请人补充资料。'

    # 小镇、成员、镇长、治理投票和领地管理消息；{action}=投票创建动作，{town}=小镇名，
    # {count}=批量操作的小镇数量，{detail}=技术详情。
    usage-town: '用法: /townadmin town <view|delete> <小镇全名>'
    usage-town-delete: '用法: /townadmin town delete <小镇全名> <原因>'
    town-not-found: '找不到小镇 “{town}”'
    town-delete-confirmation: '删除小镇“{town}”（审计记录会保留）'
    town-action-unsupported: 'town 只支持 view 或 delete'
    town-title: '&6{town} [代码 {code}]'
    town-status: '&7status={status} mayor={mayor} version={version}'
    town-territory: '&7领地={world} {x},{z} Residence={residence} projection={projection}'
    town-deleted: '&a小镇“{town}”已删除。'
    town-delete-residence-failed: '&c小镇已安全归档，但领地移除失败：{detail}。名称、小镇代码和区块仍保持锁定；处理后可重复执行删除命令。'
    role-invalid: '&c角色只支持 DEPUTY_MAYOR 或 MEMBER；MAYOR 请使用镇长转移流程。'
    role-updated: '&a成员角色已调整为 {role}。'
    usage-member: '用法: /townadmin member <add|remove|role> <小镇全名> <玩家> <原因|角色>'
    member-action-unsupported: 'member 只支持 add、remove 或 role'
