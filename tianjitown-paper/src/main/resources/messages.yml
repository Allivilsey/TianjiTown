# TianjiTown 玩家消息和 Dialog 文本。
# 所有文本均支持 & 颜色码；{name} 形式的内容是运行时占位符。
system:
  # 玩家入口处于维护状态时显示。
  maintenance: '&c小镇系统正在维护，请稍后再试。'
  # 玩家点击已经失效的 Dialog 操作时显示。
  menu-expired: '&c这个界面已经失效，请重新打开小镇服务。'
  invalid-menu-data: '&c界面数据已过期，请重新打开后再试。'
  # {detail} 为具体失败原因。
  operation-failed: '&c这项操作错误：{detail}'

handbook:
  # 通过小镇手册打开玩家入口后的领取结果。
  received: '&a小镇手册已放入你的背包。'
  # {minutes} 为剩余冷却时间（分钟）。
  cooldown: '&e每小时可以领取一次小镇手册，请在 {minutes} 分钟后再试。'

station:
  # 管理员设置、移除公共服务台或专属服务台时的结果。
  created-public: '&a已设置公共小镇服务台。'
  created-town: '&a已为“{town}”设置专属小镇服务台。'
  already-exists: '&e这个讲台已经是小镇服务台。'
  town-limit: '&e“{town}”已经拥有一个专属小镇服务台，请先移除旧服务台。'
  removed: '&a小镇服务台已移除。'
  mayor-only: '&c只有小镇镇长或管理员可以放置手册来设置服务台。'

application:
  # 建镇申请草稿与初始成员提醒的结果。
  draft-saved: '&a申请草稿已保存。接下来请选择小镇领地并等待两名初始成员确认。'
  reminder-sent: '&a已重新提醒尚未确认的初始成员。'
  # {seconds} 为剩余提醒冷却时间（秒）。
  reminder-cooldown: '&e五分钟内只能提醒一次，请在 {seconds} 秒后再试。'

