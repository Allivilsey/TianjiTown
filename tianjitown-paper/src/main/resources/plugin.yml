name: TianjiTown
version: '${project.version}'
main: org.allivlisey.tianjitown.paper.TianjiTownPlugin
api-version: '26.2'
load: POSTWORLD
authors: [Allivilsey]
libraries:
  - 'com.zaxxer:HikariCP:${hikari.version}'
  - 'org.flywaydb:flyway-core:${flyway.version}'
  - 'org.xerial:sqlite-jdbc:${sqlite.version}'
softdepend: [Vault, Residence, QuickShop-Hikari, Jobs, GlobalMarketPlus, XConomy, WorldBorder, HuskSync]
commands:
  tianjitown-callback:
    description: 小镇聊天按钮回调
  tianjitown:
    description: TianjiTown 管理命令
    usage: /tianjitown help
permissions:
  tianjitown.admin:
    description: TianjiTown 全部管理权限
    default: op
    children:
      tianjitown.admin.money: true
      tianjitown.admin.tax: true
      tianjitown.admin.ledger: true
      tianjitown.admin.buff: true
      tianjitown.admin.operations: true
  tianjitown.admin.money:
    description: 查询和调整小镇公共资金
    default: op
  tianjitown.admin.tax:
    description: 强制调整小镇统一收入税率
    default: op
  tianjitown.admin.ledger:
    description: 查询小镇完整公共账本
    default: op
  tianjitown.admin.buff:
    description: 查询和代购公共 Buff
    default: op
  tianjitown.admin.operations:
    description: 执行统一诊断
    default: op
