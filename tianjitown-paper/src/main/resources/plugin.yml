name: TianjiTown
version: '${project.version}'
main: cn.tianji.town.paper.TianjiTownPlugin
api-version: '26.2'
load: POSTWORLD
authors: [Tianji]
description: 天际服小镇治理与统一经济系统
softdepend: [Vault, Residence, QuickShop-Hikari, Jobs, GlobalMarketPlus, XConomy, WorldGuard]
commands:
  townadmin:
    description: TianjiTown 管理命令
    usage: /townadmin help
permissions:
  tianjitown.admin:
    description: TianjiTown 全部管理权限
    default: op
    children:
      tianjitown.admin.phase0: true
      tianjitown.admin.money: true
      tianjitown.admin.tax: true
      tianjitown.admin.ledger: true
      tianjitown.admin.expand: true
      tianjitown.admin.buff: true
      tianjitown.admin.operations: true
  tianjitown.admin.phase0:
    description: 执行第0阶段预发验证
    default: op
  tianjitown.admin.money:
    description: 查询、调整和对账小镇公共资金
    default: op
  tianjitown.admin.tax:
    description: 强制调整小镇统一收入税率
    default: op
  tianjitown.admin.ledger:
    description: 查询小镇完整公共账本
    default: op
  tianjitown.admin.expand:
    description: 查询和代办小镇领地扩张
    default: op
  tianjitown.admin.buff:
    description: 查询、代购和退款取消公共 Buff
    default: op
  tianjitown.admin.operations:
    description: 执行统一诊断与在线备份
    default: op

