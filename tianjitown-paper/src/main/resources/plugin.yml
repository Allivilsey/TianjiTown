name: TianjiTown
version: '${project.version}'
main: cn.tianji.town.paper.TianjiTownPlugin
api-version: '26.2'
load: POSTWORLD
authors: [Tianji]
description: 天际服小镇系统（阶段2生产版）
softdepend: [Vault, Residence, QuickShop-Hikari, XConomy, WorldGuard]
commands:
  townadmin:
    description: TianjiTown 管理命令
    usage: /townadmin help
    permission: tianjitown.admin
permissions:
  tianjitown.admin:
    description: TianjiTown 全部管理权限
    default: op
  tianjitown.admin.phase0:
    description: 执行第0阶段预发验证
    default: op

