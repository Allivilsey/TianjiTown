name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Reproducibility check
        run: |
          artifact="$(find tianjitown-paper/target -maxdepth 1 -type f -name 'TianjiTown-*.jar' -print -quit)"
          test -n "$artifact"
          cp "$artifact" /tmp/first.jar
          mvn -B -ntp clean package -DskipTests
          cmp /tmp/first.jar "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: TianjiTown
          path: tianjitown-paper/target/TianjiTown-*.jar
          retention-days: 7
          if-no-files-found: error
