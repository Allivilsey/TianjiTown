name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Reproducibility check
        run: |
          cp tianjitown-paper/target/TianjiTown-0.1.0-SNAPSHOT.jar /tmp/first.jar
          mvn -B -ntp clean package -DskipTests
          cmp /tmp/first.jar tianjitown-paper/target/TianjiTown-0.1.0-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: TianjiTown-phase0
          path: tianjitown-paper/target/TianjiTown-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
